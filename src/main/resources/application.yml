server:
  port: 8080

spring:
  application:
    name: codeguard


  datasource:
    url: jdbc:postgresql://localhost:5432/codeguard
    username: postgres
    password: Pass123
    driver-class-name: org.postgresql.Driver


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Это заставит Hibernate использовать правильные типы Postgres (например, TEXT)
        dialect: org.hibernate.dialect.PostgreSQLDialect


  flyway:
    enabled: false


  data:
    redis:
      host: localhost
      port: 6379


application:
  security:
    jwt:
      secret-key: "my-super-secret-key-for-codeguard-project-2026-very-long"
      expiration: 86400000

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG