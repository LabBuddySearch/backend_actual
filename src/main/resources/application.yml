server:
  port: 8080

spring:
  application:
    name: codeguard

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/codeguard}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:Pass123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET:CHANGE_ME_IN_PROD_USE_LONG_RANDOM_SECRET}
      expiration: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # Список origin через запятую (без пробелов или с trim в коде). Для credentials нельзя использовать *.
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  rate-limit:
    submits-per-minute-per-user: ${APP_SUBMIT_RATE_PER_MINUTE:30}
  execution:
    arena-image: ${ARENA_JAVA_IMAGE:codeguard-arena-java:latest}
    python-image: ${ARENA_PYTHON_IMAGE:codeguard-arena-python:latest}
    cpu-set: ${DOCKER_CPU_SET:0}
    default-memory-mb: ${DEFAULT_ARENA_MEMORY_MB:128}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
