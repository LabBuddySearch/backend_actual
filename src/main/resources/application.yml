# Настройки сервера
server:
  port: 8080

# Основные настройки Spring
spring:
  application:
    name: codeguard

  # 🐘 Настройка PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/codeguard
    username: user
    password: pass
    driver-class-name: org.postgresql.Driver

  # 🛠 Настройка JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 🚀 Настройка Flyway (Миграции БД)
  flyway:
    enabled: true
    baseline-on-migrate: true

  # ⚡ Настройка Redis
  data:
    redis:
      host: localhost
      port: 6379

# 🛡 Твои кастомные настройки безопасности (JWT)
application:
  security:
    jwt:
      secret-key: "my-super-secret-key-for-codeguard-project-2026-very-long"
      expiration: 86400000

# Настройки логирования
logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG